<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | TripEase</title>

    <meta
      name="description"
      content="Sign in to your TripEase account and plan your next journey."
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0284c7",
              "primary-dark": "#0369a1",
              secondary: "#ff8c42",
              tripdark: "#0f172a",
            },
            fontFamily: {
              sans: ["DM Sans", "sans-serif"],
              outfit: ["Outfit", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body
    class="flex h-dvh flex-col bg-white font-sans text-slate-900"
  >
    <!-- Header -->
    <header class="flex shrink-0 justify-center px-4 py-2 sm:py-3">
      <a
        href="/index.html"
        class="flex shrink-0 items-center gap-2 no-underline"
      >
        <img
          src="/assets/images/tripease-logo.png"
          alt="TripEase Logo"
          class="h-10 w-10 object-contain sm:h-12 sm:w-12"
        />

        <span
          class="font-outfit text-xl font-bold text-[var(--text-color)] sm:text-3xl"
        >
          Trip<span class="text-[rgb(255,127,48)]">Ease</span>
        </span>
      </a>
    </header>

    <!-- Main Login Section -->
    <main
      class="flex flex-1 items-start justify-center px-4 py-2"
    >
      <div class="w-full max-w-sm">
        <!-- Login Card -->
        <section
          class="rounded-xl border border-slate-300 bg-white p-4 shadow-sm sm:p-5 md:p-6"
        >
          <h1
            class="mb-3 font-outfit text-2xl font-medium text-tripdark sm:text-3xl"
          >
            Sign in
          </h1>

          <!-- Login Form -->
          <form id="loginForm" class="space-y-3">
            <!-- Email / Mobile -->
            <div>
              <label
                for="email"
                class="mb-2 block text-sm font-bold text-slate-800"
              >
                Enter email or mobile number
              </label>

              <input
                type="text"
                id="email"
                name="email"
                placeholder="Email or mobile number"
                autocomplete="username"
                required
                class="h-11 w-full rounded-lg border border-slate-400 px-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-sky-100"
              />
            </div>

            <!-- Continue Button -->
            <button
              type="submit"
              class="h-11 w-full rounded-full bg-[#ffd814] text-sm font-semibold text-black transition hover:bg-[#f7ca00] focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:ring-offset-2"
            >
              Continue
            </button>
          </form>

          <!-- Terms & Conditions -->
          <p class="mt-4 text-xs leading-5 text-slate-700">
            By continuing, you agree to TripEase's

            <a href="#" class="text-primary underline hover:text-primary-dark">
              Conditions of Use
            </a>

            and

            <a href="#" class="text-primary underline hover:text-primary-dark">
              Privacy Notice </a
            >.
          </p>

          <!-- Need Help -->
          <details class="mt-3">
            <summary
              class="flex cursor-pointer list-none items-center gap-2 text-sm font-medium text-primary hover:text-primary-dark"
            >
              <span>Need help?</span>

              <i class="fa-solid fa-chevron-down text-xs"></i>
            </summary>

            <div
              class="mt-3 flex flex-col gap-2 border-l-2 border-sky-100 pl-4 text-xs font-semibold"
            >
              <a href="/pages/help-center.html" class="text-primary hover:underline">
                Forget Passsword
              </a>

              <a
                href="/pages/help-center.html"
                class="text-primary hover:underline"
              >
                Visit TripEase Help Center
              </a>
            </div>
          </details>
        </section>

        <!-- Create Account Section -->
        <section class="mt-5">
          <div class="mb-3 flex items-center gap-3">
            <div class="h-px flex-1 bg-slate-300"></div>

            <span class="whitespace-nowrap text-xs text-slate-500">
              New to TripEase?
            </span>

            <div class="h-px flex-1 bg-slate-300"></div>
          </div>

          <a
            href="/pages/accounts/signup.html"
            class="flex h-11 w-full items-center justify-center rounded-full border border-slate-400 px-3 text-center text-sm font-medium text-slate-800 transition hover:border-slate-600 hover:bg-slate-50"
          >
            Create your TripEase account
          </a>
        </section>
      </div>
    </main>

    <!-- Footer -->
    <footer class="shrink-0 border-t border-slate-300 px-3 py-2 sm:py-3">
      <div class="flex flex-wrap justify-center gap-x-5 gap-y-2 text-xs">
        <a href="#" class="text-primary hover:underline">
          Terms & Conditions
        </a>

        <a href="#" class="text-primary hover:underline"> Privacy Policy </a>

        <a href="/pages/help-center.html" class="text-primary hover:underline">
          Help
        </a>
      </div>

      <p class="mt-2 text-center text-xs text-slate-500">
        © 2026 TripEase. All rights reserved.
      </p>
    </footer>

    <script>
      //ACCESS ELEMENT
      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");

      // CREATE ERROR MESSAGE ELEMENT

      const emailError = document.createElement("p");

      emailError.id = "emailError";
      emailError.className = "hidden mt-1 text-xs text-red-600 text-center";

      emailInput.insertAdjacentElement("afterend", emailError);

      // SHOW ERROR

      function showError(message) {
        emailInput.classList.remove("border-slate-400");
        emailInput.classList.add("border-red-500");

        emailError.textContent = message;
        emailError.classList.remove("hidden");
      }

      // REMOVE ERROR

      function removeError() {
        emailInput.classList.remove("border-red-500");
        emailInput.classList.add("border-slate-400");

        emailError.textContent = "";
        emailError.classList.add("hidden");
      }

      // VALIDATE EMAIL OR MOBILE

      function validateLoginInput() {
        const value = emailInput.value.trim();

        if (value === "") {
          showError("Please enter your email or mobile number.");
          return false;
        }

        // Email validation
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Indian mobile number validation
        const mobilePattern = /^[6-9]\d{9}$/;

        if (emailPattern.test(value) || mobilePattern.test(value)) {
          removeError();
          return true;
        }

        showError(
          "Please enter a valid email address or 10-digit mobile number.",
        );

        return false;
      }

      emailInput.addEventListener("input", () => {
        removeError();
      });

      // FORM SUBMISSION

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const isValid = validateLoginInput();

        if (!isValid) {
          emailInput.focus();
          return;
        }
      });
    </script>
  </body>
</html>
